name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Resolve dependencies
        run: |
          go mod tidy
          echo '--- GO_MOD_BEGIN ---'
          cat go.mod
          echo '--- GO_MOD_END ---'
          echo '--- GO_SUM_BEGIN ---'
          cat go.sum
          echo '--- GO_SUM_END ---'

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
